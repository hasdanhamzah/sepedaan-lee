<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sepedaan Lee - Penyewaan Sepeda</title>
  
  <!-- Favicon Sepeda -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2972/2972185.png" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0f172a;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #0f172a;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Overlay Loader Modern */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-card {
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 320px;
      width: 90%;
    }

    /* Icon Sepeda Berkelip/Membal */
    .bike-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 4px 10px rgba(16, 185, 129, 0.4));
      animation: bounce 1.8s infinite ease-in-out;
    }

    /* Ring Spinner Animasi */
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 1.2rem auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loader-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.4rem 0;
      letter-spacing: 0.5px;
    }

    .loader-text {
      font-size: 0.875rem;
      color: #94a3b8;
      margin: 0;
      animation: pulse 1.5s infinite ease-in-out;
    }

    /* Keyframe Animations */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Class untuk menghilangkan loader secara halus */
    .loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- Loader Screen -->
    <div class="loader-overlay" id="loader">
      <div class="loader-card">
        <img src="https://cdn-icons-png.flaticon.com/512/2972/2972185.png" alt="Sepedaan Lee Logo" class="bike-icon">
        <div class="spinner"></div>
        <h1 class="loader-title">Sepedaan Lee</h1>
        <p class="loader-text">Menyiapkan Aplikasi...</p>
      </div>
    </div>

    <!-- Web App Frame -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbyzfGS9dsFwu3MBOqIlcrvtEGKq7yb9u1aOhNC33ExNEmjvspcbiaGSEbrt8TgYT_4/exec" 
      title="Sepedaan Lee - Web App"
      onload="hideLoader()"
      allow="geolocation; microphone; camera; midi; encrypted-media;"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
